# Payments domain ontology (CLAUDE.md section 14).
#
# Section 15's semantic rule is encoded structurally here: "balance" is
# listed as an alias under all three balance fields on `merchant`
# (ledger_balance, available_balance, settlement_balance). A query that
# only says "balance" therefore resolves to all three with equal
# confidence -> ambiguous, by construction, with no special-casing in
# code. A query that says "settlement balance" matches the longer,
# more specific alias and resolves uniquely.
#
# `source_table` records which physical table (see data/schema.sql)
# actually owns the field, since the entity a user talks about
# ("merchant") and the table a field lives in ("settlement") often
# differ - the Phase 4 SQL compiler needs this to know what to JOIN.

merchant:
  aliases:
    - merchant
    - merchants
    - seller
    - sellers
    - business
    - businesses
  fields:
    merchant_name:
      aliases: [merchant name, business name, name]
      datatype: string
      source_table: merchant
    country:
      aliases: [country, nation]
      datatype: string
      source_table: merchant
    currency:
      aliases: [currency]
      datatype: string
      source_table: merchant
    merchant_type:
      aliases: [merchant type, business type, type]
      datatype: string
      source_table: merchant
    status:
      aliases: [status]
      datatype: string
      source_table: merchant
    ledger_balance:
      aliases: [ledger balance, book balance, balance]
      datatype: decimal
      source_table: account
    available_balance:
      aliases: [available balance, usable balance, balance]
      datatype: decimal
      source_table: account
    settlement_balance:
      aliases: [settlement balance, settlement amount pending, pending settlement, balance]
      datatype: decimal
      source_table: settlement
    settlement_status:
      aliases: [settlement status]
      datatype: string
      source_table: settlement

