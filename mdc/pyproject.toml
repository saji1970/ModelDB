[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdc"
version = "0.1.0"
description = "Molecular Data Center - conversational data-access platform over SQL / Matrix / DNA storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
mdc = "mdc.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdc = ["ontology/*.yaml", "schema/*.yaml", "api/static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
